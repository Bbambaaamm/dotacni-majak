name: Zlínský regional connector live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1,4"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -e packages/source-sdk
          python -m pip install -e connectors/zlinsky
      - name: Run public source smoke
        env:
          PYTHONPATH: pipelines/ingestion/src
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          from datetime import datetime, timezone
          from dotacni_majak_ingestion.snapshot import LocalRawSnapshotStore
          from dotacni_majak_source_sdk import AdapterContext, GuardedHttpClient
          from dotacni_majak_zlinsky import ZlinskyAdapter

          async def main():
              adapter = ZlinskyAdapter()
              with tempfile.TemporaryDirectory() as tmp:
                  async with GuardedHttpClient(
                      allowed_hosts=set(adapter.descriptor.allowed_hosts),
                      requests_per_second=adapter.descriptor.requests_per_second,
                      max_concurrency=adapter.descriptor.max_concurrency,
                      max_response_bytes=10 * 1024 * 1024,
                  ) as http:
                      ctx = AdapterContext(
                          run_id="live-smoke",
                          http=http,
                          logger=None,
                          budget=None,
                          now=datetime.now(timezone.utc),
                          snapshots=LocalRawSnapshotStore(tmp),
                      )
                      health = await adapter.healthcheck(ctx)
                      if health.status.value == "UNAVAILABLE":
                          raise SystemExit(f"source unavailable: {health.detail}")
                      page = await adapter.discover(ctx, None)
                      if not page.items:
                          raise SystemExit("Zlínský source returned zero grant records")
                      print(f"health={health.status.value} records={len(page.items)}")
                      print(page.items[0].detail_url)

          asyncio.run(main())
          PY
