name: MŠMT and OP JAK live probe

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/msmt
      - name: Run live probes
        run: python3 scripts/smoke_msmt_opjak_connectors.py
