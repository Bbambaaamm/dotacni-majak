name: Public Beta Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require anonymized real usability evidence
        run: python3 scripts/validate_beta_research.py --require-gate research/beta-sessions.json
