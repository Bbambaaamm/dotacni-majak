name: EU Funding API live contract probe

on:
  push:
    branches:
      - feat/eu-funding-connector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Source SDK
        run: python3 -m pip install -e packages/source-sdk

      - name: Probe official EU Funding & Tenders API
        run: python3 scripts/probe_eu_funding_api.py
