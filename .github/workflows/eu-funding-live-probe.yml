name: EU Funding connector live smoke

on:
  pull_request:
    paths:
      - "connectors/eu-funding/**"
      - "scripts/smoke_eu_funding_connector.py"
      - ".github/workflows/eu-funding-live-probe.yml"
      - "packages/source-sdk/**"
      - "pipelines/ingestion/**"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Source SDK
        run: python3 -m pip install -e packages/source-sdk

      - name: Smoke-test official EU Funding & Tenders connector
        run: python3 scripts/smoke_eu_funding_connector.py
