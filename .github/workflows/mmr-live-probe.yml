name: MMR live probe

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 2,5"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install -e packages/source-sdk -e connectors/mmr
      - run: python3 scripts/smoke_mmr_connector.py
