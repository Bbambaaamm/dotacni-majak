name: Regional public alternatives research

on:
  pull_request:
    paths:
      - "scripts/research_regional_public_alternatives.mjs"
      - ".github/workflows/research-regional-public-alternatives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Probe official public regional alternatives
        run: node scripts/research_regional_public_alternatives.mjs
