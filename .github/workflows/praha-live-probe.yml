name: Prague regional connector live smoke

on:
  pull_request:
    paths:
      - "connectors/praha/**"
      - "scripts/smoke_praha_connector.py"
      - ".github/workflows/praha-live-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/praha
      - name: Run Prague live probe
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_praha_connector.py
