name: Středočeský regional connector live smoke

on:
  pull_request:
    paths:
      - "connectors/stredocesky/**"
      - "scripts/smoke_stredocesky_connector.py"
      - ".github/workflows/stredocesky-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/stredocesky
      - name: Run public Středočeský funds-guide smoke
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_stredocesky_connector.py
