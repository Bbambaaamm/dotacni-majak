name: Pardubický regional connector live smoke

on:
  pull_request:
    paths:
      - "connectors/pardubicky/**"
      - "scripts/smoke_pardubicky_connector.py"
      - ".github/workflows/pardubicky-live-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/pardubicky
      - name: Run Pardubický live probe
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_pardubicky_connector.py
