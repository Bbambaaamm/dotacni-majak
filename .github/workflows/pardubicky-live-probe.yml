name: Pardubický regional connector live smoke

on:
  pull_request:
    paths:
      - "connectors/pardubicky/**"
      - "scripts/smoke_pardubicky_connector.py"
      - ".github/workflows/pardubicky-live-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/pardubicky
      - name: Run Pardubický live probe
        env:
          # PR validation remains deterministic through fixtures. A genuine
          # upstream TLS/network outage is reported but does not encourage us
          # to disable certificate verification just to make the PR green.
          ALLOW_SOURCE_UNAVAILABLE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_pardubicky_connector.py
