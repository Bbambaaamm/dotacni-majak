name: MK live probe

on:
  workflow_dispatch:
  schedule:
    - cron: "57 5 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/mk
      - name: Run live probe
        run: python3 scripts/smoke_mk_connector.py
