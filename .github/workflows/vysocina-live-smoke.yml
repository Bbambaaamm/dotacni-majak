name: Vysočina connector live smoke

on:
  pull_request:
    paths:
      - "connectors/vysocina/**"
      - "scripts/smoke_vysocina_connector.py"
      - ".github/workflows/vysocina-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/vysocina
      - name: Run public Vysočina announcement smoke
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_vysocina_connector.py
