name: Generate npm lockfile temporary

on:
  push:
    branches:
      - "chore/npm-lockfile"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/npm-lockfile

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to working branch
        shell: bash
        run: |
          test -f package-lock.json
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm package lock"
          git push origin HEAD:chore/npm-lockfile
