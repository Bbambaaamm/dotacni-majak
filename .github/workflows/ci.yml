name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Test web
        run: npm run web:test

      - name: Build web
        run: npm run web:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility smoke tests
        run: npm run web:a11y

      - name: Install Source SDK
        run: python3 -m pip install -e packages/source-sdk

      - name: Install NSA connector test dependencies
        run: python3 -m pip install -e connectors/nsa

      - name: Install OPŽP connector test dependencies
        run: python3 -m pip install -e connectors/opzp

      - name: Install OP TAK connector test dependencies
        run: python3 -m pip install -e connectors/optak

      - name: Install Modernisation Fund connector test dependencies
        run: python3 -m pip install -e connectors/modernization-fund

      - name: Install DotaceEU connector test dependencies
        run: python3 -m pip install -e connectors/dotaceeu

      - name: Install Applicant profile package
        run: python3 -m pip install -e packages/applicant

      - name: Install Search package
        run: python3 -m pip install -e packages/search

      - name: Install Eligibility engine
        run: python3 -m pip install -e packages/eligibility

      - name: Install Finance engine
        run: python3 -m pip install -e packages/finance

      - name: Install Change detection
        run: python3 -m pip install -e packages/change-detection

      - name: Install Watch matcher
        run: python3 -m pip install -e packages/watches

      - name: Install Notifications
        run: python3 -m pip install -e packages/notifications

      - name: Install Workspace
        run: python3 -m pip install -e packages/workspace

      - name: Generate canonical TypeScript/Python contracts
        run: python3 scripts/generate_contracts.py --output-root /tmp/canonical-contracts

      - name: Validate canonical schemas
        run: python3 scripts/validate_schemas.py

      - name: Validate ontology data
        run: python3 scripts/validate_ontology.py

      - name: Run foundation tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Compile Python sources
        run: python3 -m compileall packages/source-sdk/src pipelines/ingestion/src connectors/nsa/src connectors/opzp/src connectors/optak/src connectors/modernization-fund/src connectors/dotaceeu/src packages/applicant/src packages/eligibility/src packages/finance/src packages/change-detection/src packages/search/src packages/watches/src packages/notifications/src packages/workspace/src packages/search/src packages/watches/src
