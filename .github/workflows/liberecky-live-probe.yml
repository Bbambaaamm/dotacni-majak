name: Liberecký regional connector live smoke

on:
  pull_request:
    paths:
      - "connectors/liberecky/**"
      - "scripts/smoke_liberecky_connector.py"
      - ".github/workflows/liberecky-live-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/liberecky
      - name: Run Liberecký live probe
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_liberecky_connector.py
