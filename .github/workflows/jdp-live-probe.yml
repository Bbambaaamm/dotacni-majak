name: JDP connector live smoke

on:
  pull_request:
    paths:
      - "connectors/jdp/**"
      - "scripts/smoke_jdp_connector.py"
      - ".github/workflows/jdp-live-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/jdp
      - name: Run JDP public API smoke
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_jdp_connector.py
