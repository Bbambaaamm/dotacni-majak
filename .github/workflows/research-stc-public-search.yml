name: STC public search research

on:
  pull_request:
    paths:
      - "scripts/research_stc_public_search.mjs"
      - ".github/workflows/research-stc-public-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Probe Středočeský public search
        run: node scripts/research_stc_public_search.mjs
