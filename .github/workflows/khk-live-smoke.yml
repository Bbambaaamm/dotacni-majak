name: KHK connector live smoke

on:
  pull_request:
    paths:
      - "connectors/khk/**"
      - "scripts/smoke_khk_connector.py"
      - ".github/workflows/khk-live-smoke.yml"
      - "packages/source-sdk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install -e packages/source-sdk
          python3 -m pip install -e connectors/khk
      - name: Run KHK public connector smoke
        run: PYTHONPATH=pipelines/ingestion/src python3 scripts/smoke_khk_connector.py
