repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9  # Reprodukovatelná verze
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.1.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx)$
        additional_dependencies: [typescript-eslint@8.10.0, eslint@9.1.0]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|md|css|html)$
