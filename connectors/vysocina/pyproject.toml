[project]
name = "dotacni-majak-vysocina"
version = "0.1.0"
description = "Kraj Vysočina limited public-announcement adapter"
requires-python = ">=3.11"
dependencies = ["dotacni-majak-source-sdk", "beautifulsoup4>=4.12,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
