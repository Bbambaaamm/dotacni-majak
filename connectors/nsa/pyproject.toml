[project]
name = "dotacni-majak-nsa"
version = "0.1.0"
description = "Národní sportovní agentura source adapter for Dotační maják"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
