[project]
name = "dotacni-majak-irop"
version = "0.1.0"
description = "IROP 2021–2027 source adapter for Dotační maják"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
