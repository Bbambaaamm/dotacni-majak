[project]
name = "dotacni-majak-msmt"
version = "0.1.0"
description = "MŠMT and OP JAK Source Adapters for Dotační maják"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dotacni-majak-source-sdk"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
