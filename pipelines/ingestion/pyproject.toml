[project]
name = "dotacni-majak-ingestion"
version = "0.1.0"
description = "RAW-first ingestion and document processing pipeline for Dotační maják"
requires-python = ">=3.11"
dependencies = [
  "dotacni-majak-source-sdk>=0.2.0",
]

[project.optional-dependencies]
documents = [
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
