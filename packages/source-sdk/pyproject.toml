[project]
name = "dotacni-majak-source-sdk"
version = "0.2.0"
description = "Source Adapter Contract for Dotační maják"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
